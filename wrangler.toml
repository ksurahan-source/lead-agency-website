name = "lead-agency-website"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "leads-db"
database_id = "b4f91404-552b-4505-a9e9-52701d44bd78"

[[d1_databases]]
binding = "CREATIVE_DB"
database_name = "hi-ob-creative-db"
database_id = "e6b3fe70-b10c-41a8-b69d-f8319c4fc253"

[[r2_buckets]]
binding = "HI_OB_R2"
bucket_name = "hi-ob"
preview_bucket_name = "hi-ob"

# ── 아래 변수들은 Cloudflare Pages 대시보드 > Settings > Environment variables 에서 설정
# ADMIN_PASSWORD     = "change-this-admin-password" (관리자 페이지 접속 비밀번호)
# META_PIXEL_ID       = "your-pixel-id"          (서버 런타임 변수)
# META_ACCESS_TOKEN   = "your-capi-token"        (민감정보 → Secret으로 설정)
# META_CAPI_MODE      = "direct"                 (기본값. gtm_server로 설정하면 앱 서버 직접 호출 대신 GTM 서버에 위임)
# META_GRAPH_API_VERSION = "v25.0"               (선택, 기본값 v25.0)
# NEXT_PUBLIC_GTM_SERVER_URL = "https://sgtm.example.com" (선택, GTM 서버 컨테이너 URL)
# TURNSTILE_SECRET_KEY = "your-turnstile-secret" (민감정보 → Secret으로 설정)
