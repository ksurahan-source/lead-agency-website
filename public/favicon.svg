<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 투명 배경 — 파비콘/앱 아이콘용 -->

  <clipPath id="left">
    <rect x="0" y="0" width="62" height="100"/>
  </clipPath>

  <!-- TAM -->
  <circle cx="62" cy="50" r="44" fill="none" stroke="#FF3C3C" stroke-width="1.5" opacity="0.5" clip-path="url(#left)"/>
  <!-- SAM -->
  <circle cx="62" cy="50" r="29" fill="none" stroke="#888888" stroke-width="2" opacity="0.65" clip-path="url(#left)"/>
  <!-- SOM -->
  <circle cx="62" cy="50" r="15" fill="none" stroke="#FFFFFF" stroke-width="3" clip-path="url(#left)"/>
  <!-- 중심 -->
  <circle cx="62" cy="50" r="5" fill="#FF3C3C"/>
</svg>
