<svg xmlns="http://www.w3.org/2000/svg" width="620" height="180" viewBox="0 0 620 180">
<defs>
  <filter id="sh1" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.65"/>
  </filter>
  <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
  </filter>
  <filter id="sh3" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
  </filter>
  <filter id="sh4" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
  </filter>
  <radialGradient id="gO" cx="50%" cy="22%" r="62%">
    <stop offset="0%" stop-color="#FF7040"/>
    <stop offset="100%" stop-color="#CC3000"/>
  </radialGradient>
  <radialGradient id="gC" cx="50%" cy="22%" r="62%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#D8D4CE"/>
  </radialGradient>
  <radialGradient id="gK" cx="50%" cy="18%" r="62%">
    <stop offset="0%" stop-color="#FF6030"/>
    <stop offset="100%" stop-color="#BB2800"/>
  </radialGradient>
  <radialGradient id="gOB" cx="38%" cy="18%" r="72%">
    <stop offset="0%" stop-color="#FF6030"/>
    <stop offset="100%" stop-color="#C42B00"/>
  </radialGradient>
  <radialGradient id="gWH" cx="38%" cy="18%" r="72%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#CCCCCC"/>
  </radialGradient>
  <mask id="mTt"><ellipse cx="0" cy="-52" rx="108" ry="28" fill="white"/><ellipse cx="0" cy="-48" rx="78" ry="20" fill="black"/></mask>
  <mask id="mTs"><ellipse cx="0" cy="-44" rx="108" ry="28" fill="white"/><ellipse cx="0" cy="-40" rx="78" ry="20" fill="black"/></mask>
  <mask id="mSt"><ellipse cx="0" cy="-22" rx="78" ry="32" fill="white"/><ellipse cx="0" cy="-16" rx="50" ry="22" fill="black"/></mask>
  <mask id="mSs"><ellipse cx="0" cy="-12" rx="78" ry="32" fill="white"/><ellipse cx="0" cy="-6"  rx="50" ry="22" fill="black"/></mask>
  <mask id="mMt"><ellipse cx="0" cy="14"  rx="50" ry="36" fill="white"/><ellipse cx="0" cy="20"  rx="28" ry="22" fill="black"/></mask>
  <mask id="mMs"><ellipse cx="0" cy="26"  rx="50" ry="36" fill="white"/><ellipse cx="0" cy="32"  rx="28" ry="22" fill="black"/></mask></defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&display=swap');</style>
<rect width="620" height="180" fill="#0A0A0A"/>
  <!-- 심볼: scale(0.667), 수직 중앙 y=90 -->
  <g transform="translate(78,90) scale(0.667)">
  <ellipse cx="0" cy="-44" rx="108" ry="28" fill="#7A2000" filter="url(#sh1)" mask="url(#mTs)"/>
  <ellipse cx="0" cy="-52" rx="108" ry="28" fill="url(#gO)" mask="url(#mTt)"/>
  <ellipse cx="0" cy="-12" rx="78"  ry="32" fill="#5A1800" filter="url(#sh2)" mask="url(#mSs)"/>
  <ellipse cx="0" cy="-22" rx="78"  ry="32" fill="url(#gO)" mask="url(#mSt)"/>
  <ellipse cx="0" cy="26"  rx="50"  ry="36" fill="#9A9690" filter="url(#sh3)" mask="url(#mMs)"/>
  <ellipse cx="0" cy="14"  rx="50"  ry="36" fill="url(#gC)" mask="url(#mMt)"/>
  <ellipse cx="0" cy="58"  rx="28"  ry="22" fill="#882000" filter="url(#sh4)"/>
  <ellipse cx="0" cy="46"  rx="28"  ry="22" fill="url(#gK)"/>
  <ellipse cx="-4" cy="41" rx="12"  ry="6"  fill="#FF9070" opacity="0.4"/></g>
  <!-- 구분선 -->
  <line x1="166" y1="20" x2="166" y2="160" stroke="#1E1E1E" stroke-width="0.6"/>
  <!-- 워드마크 -->
  <text x="186" y="116"
    font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="92" font-weight="900" letter-spacing="-4">
    <tspan fill="url(#gWH)">히</tspan><tspan fill="url(#gOB)">옵</tspan>
  </text>
  <!-- 서브 -->
  <text x="188" y="140"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="2"
    fill="#444">hi-ob</text>
  <rect x="188" y="150" width="414" height="0.5" fill="#1E1E1E"/>
  <text x="188" y="164"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9" letter-spacing="4"
    fill="#333">PERFORMANCE MARKETING</text>
</svg>