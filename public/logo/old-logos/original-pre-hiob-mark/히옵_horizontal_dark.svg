<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <rect width="800" height="200" fill="#0A0A0A"/>

  <clipPath id="left">
    <rect x="0" y="0" width="112" height="200"/>
  </clipPath>

  <!-- TAM -->
  <circle cx="112" cy="100" r="88" fill="none" stroke="#FF3C3C" stroke-width="2" opacity="0.5" clip-path="url(#left)"/>
  <!-- SAM -->
  <circle cx="112" cy="100" r="57" fill="none" stroke="#888888" stroke-width="2.5" opacity="0.65" clip-path="url(#left)"/>
  <!-- SOM -->
  <circle cx="112" cy="100" r="30" fill="none" stroke="#FFFFFF" stroke-width="4" clip-path="url(#left)"/>
  <!-- 중심점 -->
  <circle cx="112" cy="100" r="8" fill="#FF3C3C"/>

  <!-- 메인 워드마크: 히옵 (한글 대형) -->
  <text x="138" y="118" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Black Han Sans', sans-serif" font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="-2">히</text>
  <text x="228" y="118" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Black Han Sans', sans-serif" font-size="72" font-weight="900" fill="#FF3C3C" letter-spacing="-2">옵</text>

  <!-- 서브: hi-ob 영문 소형 -->
  <text x="140" y="142" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#444" letter-spacing="2">hi-ob</text>

  <!-- 구분선 -->
  <rect x="140" y="152" width="340" height="0.5" fill="#1E1E1E"/>

  <!-- 태그라인 한국어 -->
  <text x="140" y="168" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#2E2E2E" letter-spacing="2">퍼포먼스 마케팅 · 메타 · 구글</text>
</svg>
