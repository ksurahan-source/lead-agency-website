<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 370 170">
<defs>
  <radialGradient id="gOB" cx="38%" cy="18%" r="72%">
    <stop offset="0%"   stop-color="#FF6030"/>
    <stop offset="100%" stop-color="#C42B00"/>
  </radialGradient>
  <radialGradient id="gWH" cx="38%" cy="18%" r="72%">
    <stop offset="0%"   stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#CCCCCC"/>
  </radialGradient>
</defs>



  <!-- 히옵: 128px, 자간 타이트 -->
  <text x="0" y="126"
    font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="128" font-weight="900" letter-spacing="-6">
    <tspan fill="url(#gWH)">히</tspan><tspan fill="url(#gOB)">옵</tspan>
  </text>

  <!-- hi-ob: 히옵 오른쪽에 베이스라인 하단 정렬 -->
  <!-- 히옵 너비 약 234px → hi-ob x=238 -->
  <text x="242" y="126"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" font-weight="900" letter-spacing="-1"
    fill="#444444" dominant-baseline="auto">hi-ob</text>

  <!-- 구분선 -->
  <rect x="0" y="140" width="370" height="0.5" fill="#222222"/>

  <!-- 태그라인 -->
  <text x="370" y="156" text-anchor="end"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" letter-spacing="3.5"
    fill="#3A3A3A">PERFORMANCE MARKETING</text>
</svg>